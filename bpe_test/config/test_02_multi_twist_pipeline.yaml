scheduler:
  realtime:
    enabled: false
  timing:
    spin_before_deadline: 500us

blocks:
  - name: twist_producer_a
    type: bpe_test/TwistProducerBlock
    execution:
      policy: timer
      period: 10ms
    config:
      blackboard_output: multi_raw_twist_a

  - name: twist_producer_b
    type: bpe_test/TwistProducerBlock
    execution:
      policy: timer
      period: 10ms
    config:
      blackboard_output: multi_raw_twist_b

  - name: multi_twist_transform
    type: bpe_test/MultiTwistTransformBlock
    execution:
      policy: timer
      period: 10ms
    config:
      blackboard_inputs: [multi_raw_twist_a, multi_raw_twist_b]
      blackboard_outputs: [multi_processed_twist_a, multi_processed_twist_b]

  - name: twist_checker_a
    type: bpe_test/TwistCheckerBlock
    execution:
      policy: timer
      period: 10ms
    config:
      blackboard_input: multi_processed_twist_a

  - name: twist_checker_b
    type: bpe_test/TwistCheckerBlock
    execution:
      policy: timer
      period: 10ms
    config:
      blackboard_input: multi_processed_twist_b
