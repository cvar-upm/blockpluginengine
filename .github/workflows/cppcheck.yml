name: cppcheck

on:
  push:
    branches: [stable]
    paths:
      - 'block_plugin_engine/CMakeLists.txt'
      - 'block_plugin_engine/package.xml'
      - 'block_plugin_engine/*.xml'
      - 'block_plugin_engine/include/**'
      - 'block_plugin_engine/src/**'
      - 'block_plugin_engine/test/**'
      - 'bpe_blackboard/CMakeLists.txt'
      - 'bpe_blackboard/package.xml'
      - 'bpe_blackboard/*.xml'
      - 'bpe_blackboard/include/**'
      - 'bpe_blackboard/test/**'
      - 'bpe_examples/CMakeLists.txt'
      - 'bpe_examples/package.xml'
      - 'bpe_examples/*.xml'
      - 'bpe_examples/src/**'
      - 'bpe_examples/config/**'
      - 'bpe_examples/launch/**'
      - 'bpe_ros_boundary_plugins/CMakeLists.txt'
      - 'bpe_ros_boundary_plugins/package.xml'
      - 'bpe_ros_boundary_plugins/*.xml'
      - 'bpe_ros_boundary_plugins/src/**'
      - 'bpe_ros_boundary_plugins/test/**'
      - 'bpe_test/CMakeLists.txt'
      - 'bpe_test/package.xml'
      - 'bpe_test/*.xml'
      - 'bpe_test/include/**'
      - 'bpe_test/src/**'
      - 'bpe_test/test/**'
      - 'bpe_test/config/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: jazzy
          ROS_REPO: main
          BASEDIR: ${{ runner.temp }}/bpe-cppcheck
          ADDITIONAL_DEBS: cppcheck
          TARGET_CMAKE_ARGS: -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          AFTER_SCRIPT: >-
            status=0;
            python3 "$BASEDIR/target_ws/src/blockpluginengine/ci/static_analysis.py"
            cppcheck "$BASEDIR/target_ws/build" "$BASEDIR/report" || status=$?;
            chmod -R a+rX "$BASEDIR/report";
            exit "$status"
      - name: Publish analysis summary
        if: always()
        run: |
          report="${{ runner.temp }}/bpe-cppcheck/report/summary.md"
          if test -f "$report"; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bpe-cppcheck-jazzy-amd64
          path: ${{ runner.temp }}/bpe-cppcheck/report/
          if-no-files-found: error
          retention-days: 30
