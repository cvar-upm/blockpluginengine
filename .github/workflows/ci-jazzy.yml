name: ROS 2 Jazzy Build and Tests

on:
  push:
    branches: [main, stable]
    paths:
      - 'block_plugin_engine/CMakeLists.txt'
      - 'block_plugin_engine/package.xml'
      - 'block_plugin_engine/*.xml'
      - 'block_plugin_engine/include/**'
      - 'block_plugin_engine/src/**'
      - 'block_plugin_engine/test/**'
      - 'bpe_blackboard/CMakeLists.txt'
      - 'bpe_blackboard/package.xml'
      - 'bpe_blackboard/*.xml'
      - 'bpe_blackboard/include/**'
      - 'bpe_blackboard/test/**'
      - 'bpe_examples/CMakeLists.txt'
      - 'bpe_examples/package.xml'
      - 'bpe_examples/*.xml'
      - 'bpe_examples/src/**'
      - 'bpe_examples/config/**'
      - 'bpe_examples/launch/**'
      - 'bpe_ros_boundary_plugins/CMakeLists.txt'
      - 'bpe_ros_boundary_plugins/package.xml'
      - 'bpe_ros_boundary_plugins/*.xml'
      - 'bpe_ros_boundary_plugins/src/**'
      - 'bpe_ros_boundary_plugins/test/**'
      - 'bpe_test/CMakeLists.txt'
      - 'bpe_test/package.xml'
      - 'bpe_test/*.xml'
      - 'bpe_test/include/**'
      - 'bpe_test/src/**'
      - 'bpe_test/test/**'
      - 'bpe_test/config/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Pushes to main use AMD64 only; stable and manual runs use both.
        include: ${{ fromJSON(github.ref == 'refs/heads/main' && github.event_name == 'push' && '[{"arch":"AMD64","runner":"ubuntu-24.04"}]' || '[{"arch":"AMD64","runner":"ubuntu-24.04"},{"arch":"ARM64","runner":"ubuntu-24.04-arm"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: jazzy
          ROS_REPO: main
          CMAKE_ARGS: -DCMAKE_BUILD_TYPE=Release
