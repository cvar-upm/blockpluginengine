name: ASan and UBSan

on:
  # Temporarily manual-only while investigating ROS 2 type support leaks locally.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: jazzy
          ROS_REPO: main
          TARGET_CMAKE_ARGS: >-
            -DCMAKE_BUILD_TYPE=Debug
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
            -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
            -DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=address,undefined
          DOCKER_RUN_OPTS: >-
            -e ASAN_OPTIONS=halt_on_error=1:detect_leaks=1
            -e UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
