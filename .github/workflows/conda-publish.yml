name: Conda - publish Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bpe-conda-distribution
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.85.0
          run-install: false
          cache: false
      - uses: actions/configure-pages@v6
        id: pages
      - name: Restore channels from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/conda-distribution.py pages
      - name: Generate website from README and channel contents
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: pixi exec -c conda-forge --spec markdown --spec python python ci/conda-pages.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
