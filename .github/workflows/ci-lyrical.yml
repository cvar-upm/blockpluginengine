name: ROS 2 Lyrical Build and Tests

on:
  push:
    branches: [stable]
    paths-ignore:
      - 'README.md'
      - 'CITATION.cff'
      - '.zenodo.json'
      - 'AI_USAGE.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            runner: ubuntu-26.04
          - arch: ARM64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: lyrical
          ROS_REPO: main
          CMAKE_ARGS: -DCMAKE_BUILD_TYPE=Release
