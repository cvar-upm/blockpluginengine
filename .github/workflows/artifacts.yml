name: BPE Binary Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.ros }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ros:${{ matrix.ros }}-ros-base
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ros: jazzy, arch: amd64, runner: ubuntu-24.04}
          - {ros: jazzy, arch: arm64, runner: ubuntu-24.04-arm}
          - {ros: lyrical, arch: amd64, runner: ubuntu-26.04}
          - {ros: lyrical, arch: arm64, runner: ubuntu-26.04-arm}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y git build-essential cmake python3-colcon-common-extensions python3-rosdep
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build production packages
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          mkdir -p /tmp/bpe-build/src
          cp -a bpe_blackboard block_plugin_engine bpe_ros_boundary_plugins /tmp/bpe-build/src/
          cd /tmp/bpe-build
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro "$ROS_DISTRO" --dependency-types build --dependency-types buildtool --dependency-types build_export --dependency-types buildtool_export --dependency-types exec --as-root apt:false -y
          colcon build --merge-install --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          test "$(dpkg --print-architecture)" = '${{ matrix.arch }}'
          {
            echo "commit=$GITHUB_SHA"
            echo "ros=$ROS_DISTRO"
            echo "architecture=$(dpkg --print-architecture)"
            echo 'build_type=Release'
            cat /etc/os-release
            c++ --version
          } > install/BPE-BUILD-MANIFEST.txt
          tar -czf "$GITHUB_WORKSPACE/bpe-${ROS_DISTRO}-${{ matrix.arch }}-${GITHUB_SHA}.tar.gz" -C install .
      - name: Upload candidate (not yet validated)
        uses: actions/upload-artifact@v6
        with:
          name: candidate-${{ matrix.ros }}-${{ matrix.arch }}-${{ github.sha }}
          path: bpe-*.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  consume:
    name: Validate ${{ matrix.ros }} ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    container: ros:${{ matrix.ros }}-ros-base
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ros: jazzy, arch: amd64, runner: ubuntu-24.04}
          - {ros: jazzy, arch: arm64, runner: ubuntu-24.04-arm}
          - {ros: lyrical, arch: amd64, runner: ubuntu-26.04}
          - {ros: lyrical, arch: arm64, runner: ubuntu-26.04-arm}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install consumer tools
        run: |
          apt-get update
          apt-get install -y git build-essential cmake python3-colcon-common-extensions python3-rosdep "ros-${ROS_DISTRO}-rclpy" "ros-${ROS_DISTRO}-ros2launch"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            bpe_examples
            ci
      - uses: actions/download-artifact@v7
        with:
          name: candidate-${{ matrix.ros }}-${{ matrix.arch }}-${{ github.sha }}
          path: candidate
      - name: Install and build external consumer
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          mkdir -p /opt/bpe /tmp/bpe-consumer/src
          tar -xzf candidate/bpe-*.tar.gz -C /opt/bpe
          grep -Fx "commit=$GITHUB_SHA" /opt/bpe/BPE-BUILD-MANIFEST.txt
          grep -Fx "architecture=$(dpkg --print-architecture)" /opt/bpe/BPE-BUILD-MANIFEST.txt
          # Supply system dependencies of the binary underlay and the example.
          rosdep update
          rosdep install --from-paths /opt/bpe/share bpe_examples --ignore-src --rosdistro "$ROS_DISTRO" --skip-keys 'bpe_blackboard block_plugin_engine bpe_ros_boundary_plugins' --dependency-types build --dependency-types buildtool --dependency-types build_export --dependency-types buildtool_export --dependency-types exec --as-root apt:false -y
          source /opt/bpe/local_setup.bash
          cp -a bpe_examples /tmp/bpe-consumer/src/
          cd /tmp/bpe-consumer
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Run installed example launchers
        env:
          ROS_DOMAIN_ID: 42
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source /opt/bpe/local_setup.bash
          source /tmp/bpe-consumer/install/local_setup.bash
          python3 ci/validate_artifact.py
      - name: Upload validated binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: bpe-${{ matrix.ros }}-${{ matrix.arch }}-${{ github.sha }}
          path: candidate/bpe-*.tar.gz
          if-no-files-found: error
          retention-days: 30
          overwrite: true
