[workspace]
name = "bpe"
preview = ["pixi-build"]
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tasks]
build = { cmd = "bash ci/build-conda.sh", description = "Build BPE packages into the local Conda channel" }
plan = { cmd = "bash ci/build-conda.sh --dry-run", description = "Show the package build plan" }
rebuild = { cmd = "bash ci/build-conda.sh --force", description = "Rebuild and overwrite local BPE packages" }
